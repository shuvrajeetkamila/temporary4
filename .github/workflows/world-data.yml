name: world-data

# Fetches the real OpenStreetMap and Copernicus DEM data for the AOI, extracts
# the game layers, compiles the packaged world, and reports exactly what came
# back.
#
# This has to run here rather than on a developer machine because the project's
# build sandbox has no route to Geofabrik, Overpass or the AWS DEM bucket. For
# the same reason the raw Actions log is unreadable from there, so every step
# tees into build.log and a failure posts the tail of it as an issue.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Ignore the cached download and refetch from source"
        type: boolean
        default: false
  push:
    paths:
      - "tools/aoi.py"
      - "tools/fetch_osm.py"
      - "tools/fetch_dem.py"
      - "tools/extract_osm.py"
      - "tools/compile_world.py"
      - "tools/world_format.py"
      - ".github/workflows/world-data.yml"

concurrency:
  group: world-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install --upgrade pip
          pip install osmium shapely rasterio scipy numpy
          { osmium --version; python -V; } 2>&1 | tee -a build.log

      - name: Disk space
        run: df -h / | tee -a build.log

      - name: Restore cached source data
        if: ${{ !inputs.refresh }}
        uses: actions/cache@v4
        with:
          path: data/_cache
          key: srcdata-${{ hashFiles('tools/aoi.py') }}-v3

      - name: AOI
        run: |
          set -o pipefail
          python3 tools/aoi.py 2>&1 | tee -a build.log

      - name: Fetch OpenStreetMap extract and clip to the AOI
        run: |
          set -o pipefail
          python3 tools/fetch_osm.py --out data/osm --cache data/_cache 2>&1 | tee -a build.log

      - name: Fetch Copernicus DEM and build the elevation grid
        run: |
          set -o pipefail
          python3 tools/fetch_dem.py --out data/dem --cache data/_cache/dem 2>&1 | tee -a build.log

      - name: Extract game layers from the OSM data
        run: |
          set -o pipefail
          python3 tools/extract_osm.py --pbf data/osm/mumbai-aoi.osm.pbf \
            --out data/layers 2>&1 | tee -a build.log

      - name: Compile the packaged world
        run: |
          set -o pipefail
          python3 tools/compile_world.py --layers data/layers --dem data/dem \
            --out android/src/main/assets/world 2>&1 | tee -a build.log
          ls -l android/src/main/assets/world | tee -a build.log

      - name: Report
        if: always()
        run: |
          mkdir -p data/reports
          {
            echo "# World data acquisition"
            echo
            echo "Run \`${{ github.run_id }}\`, $(date -u +'%Y-%m-%dT%H:%M:%SZ')."
            echo
            for f in data/provenance/osm.json data/provenance/dem.json \
                     data/layers/extract_summary.json data/reports/world_build.json; do
              echo "## \`$f\`"
              echo '```json'
              if [ -f "$f" ]; then head -c 20000 "$f"; else echo '{"error":"not produced"}'; fi
              echo
              echo '```'
            done
            echo '## Sizes'
            echo '```'
            du -sh data/* android/src/main/assets/world 2>/dev/null || true
            df -h / | tail -1
            echo '```'
          } > data/reports/world_data.md

      - name: Upload intermediates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-layers
          path: |
            data/layers/
            data/provenance/
            data/reports/
            build.log
          retention-days: 14
          if-no-files-found: warn

      - name: Commit provenance and report back to the branch
        if: always()
        run: |
          git config user.name  "mumbai-world-bot"
          git config user.email "actions@github.com"
          mkdir -p data/provenance data/reports
          git add -f data/provenance data/reports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "world-data: provenance and report (run ${{ github.run_id }})"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Post the log where the sandbox can read it
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="${{ job.status }}"
          {
            echo "Run ${{ github.run_id }} finished with status **$STATE**."
            echo
            echo '```'
            tail -c 50000 build.log 2>/dev/null || echo "(no build.log)"
            echo '```'
          } > issue.md
          gh issue create --title "world-data run ${{ github.run_id }}: $STATE" \
            --body-file issue.md || true
