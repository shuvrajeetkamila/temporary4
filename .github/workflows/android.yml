name: Build Mumbai Island City APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk: ${{ steps.stage.outputs.name }}
      sha: ${{ steps.stage.outputs.sha }}
      size: ${{ steps.stage.outputs.size }}
      version: ${{ steps.stage.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset stale QA status
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          : > /tmp/ci.log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect preinstalled Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify packaged world data
        run: |
          set -o pipefail
          if [ -f tools/verify_world.py ]; then
            python3 tools/verify_world.py 2>&1 | tee -a /tmp/ci.log
          else
            echo "world verifier not present yet (milestone 0)" | tee -a /tmp/ci.log
          fi

      - name: Core unit tests (physics, geodata, streaming, packaged world)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :core:test 2>&1 | tee -a /tmp/ci.log

      - name: Summarise test results
        if: always()
        run: |
          python3 - <<'PYEOF' | tee artifacts/TEST_STATUS.md | tee -a /tmp/ci.log
          import glob, os, xml.etree.ElementTree as ET
          rows, tot, fail, skip, secs = [], 0, 0, 0, 0.0
          for f in sorted(glob.glob('core/build/test-results/test/TEST-*.xml')):
              r = ET.parse(f).getroot()
              t = int(r.get('tests', 0)); e = int(r.get('failures', 0)) + int(r.get('errors', 0))
              s = int(r.get('skipped', 0)); d = float(r.get('time', 0))
              tot += t; fail += e; skip += s; secs += d
              rows.append((r.get('name', '?').split('.')[-1], t, e, s, d))
          print('# Test status\n')
          print(f'**{tot - fail - skip} passed, {fail} failed, {skip} skipped** in {secs:.1f}s\n')
          print('| suite | tests | failed | skipped | seconds |')
          print('|---|---:|---:|---:|---:|')
          for n, t, e, s, d in rows:
              print(f'| {n} | {t} | {e} | {s} | {d:.2f} |')
          if not rows:
              print('\n**No test XML found — treat this as a failure, not a pass.**')
              raise SystemExit(1)
          if fail:
              raise SystemExit(1)
          PYEOF

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :android:assembleDebug 2>&1 | tee -a /tmp/ci.log

      - name: Stage artifact
        id: stage
        run: |
          set -euo pipefail
          VERSION="1.0.${{ github.run_number }}"
          NAME="Mumbai-The-Island-City-REALISTIC-PHYSICS-v${VERSION}.apk"
          mkdir -p artifacts
          cp android/build/outputs/apk/debug/android-debug.apk "artifacts/${NAME}"
          cd artifacts
          sha256sum "${NAME}" > "${NAME}.sha256"
          SIZE=$(stat -c%s "${NAME}")
          SHA=$(cut -d' ' -f1 "${NAME}.sha256")
          echo "name=${NAME}"       >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}"       >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"         >> "$GITHUB_OUTPUT"
          ls -lh

      - name: Validate APK package
        run: |
          set -euxo pipefail
          APK="artifacts/${{ steps.stage.outputs.name }}"
          unzip -t "$APK" > /dev/null && echo "zip integrity OK"
          unzip -l "$APK" | grep -E "classes.*\.dex"
          unzip -l "$APK" | grep -E "assets/world/"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BT}aapt2" dump badging "$APK" | head -12 | tee -a /tmp/ci.log
          "${BT}apksigner" verify --print-certs "$APK" | head -8 | tee -a /tmp/ci.log

      - name: Collect reports
        run: |
          cp DATA_SOURCES.md ASSET_LICENSES.md artifacts/ 2>/dev/null || true
          cp docs/TECH_STACK_DECISIONS.md artifacts/ 2>/dev/null || true
          cp data/geodata/MUMBAI_AOI.geojson artifacts/ 2>/dev/null || true
          python3 tools/verify_world.py > artifacts/AOI_COVERAGE_REPORT.txt
          {
            echo
            echo "APK contents (world layers):"
            unzip -l "artifacts/${{ steps.stage.outputs.name }}" | grep "assets/world/"
          } >> artifacts/AOI_COVERAGE_REPORT.txt
          cat artifacts/AOI_COVERAGE_REPORT.txt

      - name: Build record
        run: |
          cat > artifacts/BUILD_STATUS.json <<EOF
          {
            "status": "PASSED",
            "apk": "${{ steps.stage.outputs.name }}",
            "version": "${{ steps.stage.outputs.version }}",
            "bytes": ${{ steps.stage.outputs.size }},
            "sha256": "${{ steps.stage.outputs.sha }}",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "package": "ai.shuvrajeetkamila.mumbai.islandcity",
            "min_sdk": 26,
            "target_sdk": 34,
            "abis": "universal (no native code)",
            "signing": "android debug keystore"
          }
          EOF
          cat artifacts/BUILD_STATUS.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MumbaiIslandCity-APK
          path: |
            artifacts/*.apk
            artifacts/*.sha256
            artifacts/BUILD_STATUS.json
            artifacts/TEST_STATUS.md
            artifacts/AOI_COVERAGE_REPORT.txt
            artifacts/DATA_SOURCES.md
            artifacts/ASSET_LICENSES.md
            artifacts/TECH_STACK_DECISIONS.md
            artifacts/MUMBAI_AOI.geojson
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.stage.outputs.version }}
          name: Mumbai Island City v${{ steps.stage.outputs.version }}
          body: |
            **Mumbai: Island City** - automated Android build.

            | field | value |
            |---|---|
            | APK | `${{ steps.stage.outputs.name }}` |
            | Size | ${{ steps.stage.outputs.size }} bytes |
            | SHA-256 | `${{ steps.stage.outputs.sha }}` |
            | Package | `ai.shuvrajeetkamila.mumbai.islandcity` |
            | Min Android | 8.0 (API 26) |
            | Signing | debug keystore (universal, directly installable) |
            | Commit | ${{ github.sha }} |

            Install: download the `.apk` on an Android phone, open it and allow
            "Install unknown apps" for your browser / file manager when prompted.
          files: |
            artifacts/*.apk
            artifacts/*.sha256
            artifacts/BUILD_STATUS.json
            artifacts/TEST_STATUS.md
            artifacts/AOI_COVERAGE_REPORT.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export build facts
        id: facts
        run: |
          echo "apk=${{ steps.stage.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Report failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '### CI failure diagnostics' > /tmp/report.md
          echo '' >> /tmp/report.md
          echo 'Run: ${{ github.run_id }} (#${{ github.run_number }}) commit ${{ github.sha }}' >> /tmp/report.md
          echo '' >> /tmp/report.md
          echo '```' >> /tmp/report.md
          tail -c 50000 /tmp/ci.log >> /tmp/report.md 2>/dev/null || echo "(no captured log)" >> /tmp/report.md
          echo '```' >> /tmp/report.md
          gh issue create \
            --title "CI failure: run #${{ github.run_number }}" \
            --body-file /tmp/report.md \
            --repo ${{ github.repository }} || true

  device_test:
    name: Launch on an Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the APK that was just built
        uses: actions/download-artifact@v4
        with:
          name: MumbaiIslandCity-APK
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Boot emulator, install and run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 6G
          force-avd-creation: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot
          disable-animations: true
          script: bash ci/device_smoke.sh

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MumbaiIslandCity-device-evidence
          path: |
            device/*
          if-no-files-found: warn
          retention-days: 90
