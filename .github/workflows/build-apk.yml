name: build-apk

# Compiles the world, runs every gate, assembles the APK and publishes it.
# Nothing here is allowed to be skipped on the way to a release: if the world
# is missing, if a coverage checkpoint is in the wrong place, if a physics
# test fails or if the built APK does not actually contain the city, the job
# fails and no release is cut.

on:
  push:
    branches: [ 'arena/**', main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk_name: ${{ steps.meta.outputs.apk_name }}
      apk_size: ${{ steps.meta.outputs.apk_size }}
      apk_sha256: ${{ steps.meta.outputs.apk_sha256 }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the data toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet osmium shapely rasterio scipy numpy

      - name: Check the pinned source data is intact
        run: |
          # The paths in SHA256SUMS are repo-relative, so this runs from the
          # root. The file also lists itself, which cannot be satisfied: it
          # was hashed before it was written, so the recorded digest is the
          # hash of an empty file. Skip that line and check the real inputs.
          grep -v 'SHA256SUMS$' data/pinned/SHA256SUMS > /tmp/pinned.sha256
          test -s /tmp/pinned.sha256
          sha256sum -c /tmp/pinned.sha256
          ls -l data/pinned

      - name: Report the area of interest
        run: python tools/aoi.py

      - name: Extract game layers from the pinned OSM extract
        run: |
          mkdir -p data/layers
          python tools/extract_osm.py \
            --pbf data/pinned/mumbai-aoi.osm.pbf \
            --out data/layers

      - name: Compile the world
        run: |
          mkdir -p data/dem
          cp data/pinned/elevation.npz data/dem/elevation.npz
          python tools/compile_world.py \
            --layers data/layers \
            --dem data/dem \
            --out android/src/main/assets/world

      # The independent gate. It re-derives the projection from first
      # principles rather than importing it, so a bug in aoi.py cannot hide
      # behind itself, and it fails the build if any checkpoint is missing.
      - name: Verify world coverage
        run: python tools/verify_world.py --world android/src/main/assets/world

      - name: World size report
        run: |
          echo "### Compiled world" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh android/src/main/assets/world >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          r = json.load(open('data/reports/world_build.json'))
          for k in ('extent_km','land_area_km2','buildings_kept','road_runs',
                    'graph_km','inland_water_km2','chunks_non_empty'):
              if k in r: print(f"- **{k}**: {r[k]}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every core gate: physics, streaming, the fixed step, the floating
      # origin, the eco tiers and all 51 geographic checkpoints, run against
      # the world that was just compiled.
      - name: Run the core test suite
        run: gradle --no-daemon :core:test -Dmumbai.requireWorld=true

      # The prop meshes live in the android module, and so does the check
      # that they are wound the right way out. Without this the module had
      # no tests at all, which is why a third of every vehicle in the game
      # was inside out for as long as it was.
      - name: Run the android unit tests
        run: gradle --no-daemon :android:testReleaseUnitTest

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Assemble the APK
        run: |
          gradle --no-daemon :android:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=2.0.${{ github.run_number }}

      # Proving the APK is real, rather than trusting that it is. Each of
      # these has caught something at least once.
      - name: Inspect the APK
        id: meta
        run: |
          set -euo pipefail
          # Read the gate count from the report rather than hard-coding
          # it. It said 123 for two releases after the count had moved to
          # 135, which is exactly the sort of stale claim this project is
          # not allowed to make.
          GATES=$(python3 -c "import json;print(json.load(open('data/reports/verify.json'))['passed'])" 2>/dev/null || echo "all")
          echo "gates=$GATES" >> "$GITHUB_OUTPUT"
          APK=$(find android/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "using $BUILD_TOOLS"

          OUT="Mumbai-The-Island-City-v2.0.${{ github.run_number }}.apk"
          cp "$APK" "$OUT"

          echo "--- badging ---"
          "$BUILD_TOOLS/aapt2" dump badging "$OUT" | head -20

          echo "--- signature ---"
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"

          echo "--- the world must actually be inside it ---"
          for f in terrain chunks network manifest; do
            unzip -l "$OUT" | grep -q "assets/world/$f.mwl" \
              || { echo "MISSING assets/world/$f.mwl in the APK"; exit 1; }
          done
          unzip -l "$OUT" | grep 'assets/world'
          WORLD_BYTES=$(unzip -l "$OUT" | grep 'assets/world' \
            | awk '{s+=$1} END {print s}')
          echo "packaged world: $WORLD_BYTES bytes"
          test "$WORLD_BYTES" -gt 5000000 \
            || { echo "the packaged world is implausibly small"; exit 1; }

          echo "--- the code must be in there too ---"
          unzip -l "$OUT" | grep -q 'classes.dex' || exit 1

          SIZE=$(stat -c%s "$OUT")
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          echo "$SHA  $OUT" > "$OUT.sha256"

          echo "apk_name=$OUT"            >> $GITHUB_OUTPUT
          echo "apk_size=$SIZE"           >> $GITHUB_OUTPUT
          echo "apk_sha256=$SHA"          >> $GITHUB_OUTPUT
          echo "version_name=2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "version_code=${{ github.run_number }}"     >> $GITHUB_OUTPUT

          {
            echo "### APK"
            echo "- **file**: \`$OUT\`"
            echo "- **bytes**: $SIZE"
            echo "- **sha256**: \`$SHA\`"
            echo "- **packaged world**: $WORLD_BYTES bytes"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumbai-island-city-apk
          path: |
            Mumbai-The-Island-City-*.apk
            Mumbai-The-Island-City-*.apk.sha256
          retention-days: 90
          compression-level: 0

      - name: Upload the verification reports
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            data/reports/verify.json
            data/reports/world_build.json
            data/reports/world_data.md
          if-no-files-found: ignore

      - name: Publish the release
        if: success() && (github.event_name == 'push' || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Mumbai The Island City v2.0.${{ github.run_number }}
          body: |
            Built entirely from real open map data: OpenStreetMap geometry and
            Copernicus GLO-30 elevation, compiled to a streaming world and
            packaged inside the APK. No network access at runtime.

            - **APK**: `${{ steps.meta.outputs.apk_name }}`
            - **Bytes**: ${{ steps.meta.outputs.apk_size }}
            - **SHA-256**: `${{ steps.meta.outputs.apk_sha256 }}`
            - **Package**: `ai.shuvrajeetkamila.mumbai.islandcity`
            - **Version**: ${{ steps.meta.outputs.version_name }} (code ${{ steps.meta.outputs.version_code }})
            - **minSdk** 26, **targetSdk** 34, universal ABI
            - **CI run**: ${{ github.run_id }}

            Gates that passed before this was published: ${{ steps.meta.outputs.gates }}
            Python world checks and the full core suite, including all 51
            geographic checkpoints from Vasai Creek to Navy Nagar.

            Map data © OpenStreetMap contributors, ODbL 1.0.
            Elevation: Copernicus DEM © DLR e.V. / Airbus DS, ESA.

            Debug-signed, so Android will ask you to allow installation from
            an unknown source. See DELIVERY.md for the honest limits.
          files: |
            ${{ steps.meta.outputs.apk_name }}
            ${{ steps.meta.outputs.apk_name }}.sha256
          fail_on_unmatched_files: true

      - name: Record the APK facts in the repository
        run: |
          mkdir -p data/reports
          cat > data/reports/apk_build.json <<JSON
          {
            "file": "${{ steps.meta.outputs.apk_name }}",
            "bytes": ${{ steps.meta.outputs.apk_size }},
            "sha256": "${{ steps.meta.outputs.apk_sha256 }}",
            "package": "ai.shuvrajeetkamila.mumbai.islandcity",
            "version_name": "${{ steps.meta.outputs.version_name }}",
            "version_code": ${{ steps.meta.outputs.version_code }},
            "min_sdk": 26,
            "target_sdk": 34,
            "abis": "universal",
            "signing": "debug key",
            "ci_run_id": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "release_tag": "v${{ steps.meta.outputs.version_name }}"
          }
          JSON
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # verify.json and world_build.json are regenerated earlier in
          # this job. Committing them keeps the copies in the repo from
          # going stale and advertising an out-of-date gate count.
          git add data/reports/apk_build.json data/reports/verify.json \
                  data/reports/world_build.json
          git diff --cached --quiet || git commit -m "APK facts for run ${{ github.run_id }} [skip ci]"
          git pull --rebase --quiet origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}" || true

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Job logs cannot be read back from the sandbox that drives this
          # repository, so the failure is posted where it can be.
          {
            echo "Run ${{ github.run_id }} failed on ${{ github.ref_name }}."
            echo
            echo '### failed tests'
            echo '```'
            # The JUnit XML is the only place the actual assertion message
            # survives. Reports were being searched for .txt files that
            # Gradle does not write, so two failures in a row were posted as
            # an empty block and had to be guessed at.
            python3 - <<'PYEOF' || echo "(could not parse test results)"
          import glob, xml.etree.ElementTree as ET
          found = False
          for f in sorted(glob.glob('core/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      found = True
                      print(f"{tc.get('classname')}.{tc.get('name')}")
                      msg = (bad.get('message') or '').strip()
                      print('   ' + msg[:600].replace(chr(10), chr(10) + '   '))
                      body = (bad.text or '').strip().splitlines()
                      for line in body[:6]:
                          print('     ' + line[:200])
                      print()
          if not found:
              print('no failing testcase found in the XML')
          PYEOF
            echo '```'
            echo '### verify.json summary'
            echo '```json'
            python3 -c "import json;d=json.load(open('data/reports/verify.json'));print(json.dumps({k:d[k] for k in ('passed','total','failed') if k in d}));print(json.dumps([g for g in d.get('gates',[]) if g.get('status')!='PASS'][:20], indent=1))" 2>/dev/null || echo "(absent)"
            echo '```'
          } > /tmp/body.md
          gh issue create --title "build-apk failed: run ${{ github.run_id }}" \
            --body-file /tmp/body.md || true

  # Proving the thing runs. Building an APK says the code compiles; it says
  # nothing about whether the world loads, whether the shaders link on a real
  # driver, or whether the first frame ever arrives. This job installs the
  # APK on an emulator, launches it, and greps logcat for markers the app
  # only prints once it has genuinely got there.
  device_test:
    needs: build
    # 22.04 is the well-trodden runner for the emulator action; AVD creation
    # on 24.04 is where the previous attempts died before reaching the script.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the APK that was just built
        uses: actions/download-artifact@v4
        with:
          name: mumbai-island-city-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator image
        run: |
          set -x
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_SDK_ROOT/cmdline-tools" || true
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "emulator" \
                            "system-images;android-30;default;x86_64"
          echo "no" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            create avd -n mumbai -k "system-images;android-30;default;x86_64" -d pixel_4 --force
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds

      - name: Launch, load the world, render
        continue-on-error: true
        id: emu
        # The step, not just the job. A job-level timeout kills the
        # reporter with it and the run ends with no log and no verdict,
        # which is what happened when a streaming change made the app
        # work hard enough to stall the software renderer for an hour.
        timeout-minutes: 25
        run: |
          set -uo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          : > install.txt; : > start.txt; : > logcat-app.txt; : > logcat-full.txt
          : > emulator.txt

          nohup emulator -avd mumbai -no-window -no-audio -no-boot-anim \
                -no-snapshot -gpu swiftshader_indirect -camera-back none \
                -accel on -qemu -m 4096 > emulator.txt 2>&1 &
          echo "emulator pid $!" | tee -a install.txt

          adb wait-for-device
          echo "device appeared" | tee -a install.txt
          BOOTED=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=1; break
            fi
            sleep 5
          done
          echo "booted=$BOOTED after $((i*5))s" | tee -a install.txt
          [ "$BOOTED" = "1" ] || { tail -60 emulator.txt | tee -a install.txt; exit 1; }

          adb shell wm size      | tee -a install.txt
          adb shell getprop ro.build.version.sdk | tee -a install.txt
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true

          APK=$(ls Mumbai-The-Island-City-*.apk 2>/dev/null | head -1)
          echo "apk=[$APK] $(stat -c%s "$APK" 2>/dev/null) bytes" | tee -a install.txt
          test -n "$APK" || { ls -la | tee -a install.txt; exit 1; }
          adb install -r -g "$APK" 2>&1 | tee -a install.txt

          adb logcat -c || true
          adb shell am start -W -n \
            ai.shuvrajeetkamila.mumbai.islandcity/ai.shuvrajeetkamila.mumbai.android.MainActivity \
            2>&1 | tee start.txt

          # SwiftShader renders single digit frame rates, so the budget is
          # generous. The markers matter, not the speed.
          #
          # Every adb call here is wrapped in `timeout`. An unbounded
          # `adb logcat -d` against a device that has stopped answering
          # blocks for its own internal timeout, and ninety of those in
          # a polling loop is a step that runs for half an hour and
          # produces nothing - which is exactly what happened twice.
          for i in $(seq 1 90); do
            if timeout 20 adb logcat -d 2>/dev/null | grep -q MUMBAI_RENDER_OK; then
              echo "render marker seen after $((i*2))s"; break
            fi
            sleep 2
          done

          timeout 60 adb logcat -d > logcat-full.txt 2>&1 || \
            echo "(logcat -d timed out: the device stopped answering)" >> logcat-full.txt
          timeout 60 adb logcat -d -s Mumbai:V MumbaiGL:V AndroidRuntime:E System.err:V \
            > logcat-app.txt 2>&1 || true
          tail -120 logcat-app.txt || true

          # If the app produced no markers at all, find out why rather
          # than guessing: is the process alive, what is it doing, and
          # how much memory is it holding?
          if ! grep -q MUMBAI_WORLD_READY logcat-full.txt; then
            echo "--- no world marker: diagnosing ---" | tee -a install.txt
            timeout 30 adb shell ps -A 2>&1 | grep -i islandcity | tee -a install.txt || true
            timeout 30 adb shell dumpsys meminfo ai.shuvrajeetkamila.mumbai.islandcity \
              2>&1 | head -40 | tee -a install.txt || true
            PID=$(timeout 20 adb shell pidof ai.shuvrajeetkamila.mumbai.islandcity | tr -d '\r')
            if [ -n "$PID" ]; then
              timeout 20 adb shell kill -3 "$PID" || true
              sleep 8
              timeout 60 adb logcat -d -s art:V System.err:V 2>&1 | tail -80 \
                | tee -a install.txt || true
              timeout 30 adb shell cat /data/anr/traces.txt 2>/dev/null \
                | head -120 | tee -a install.txt || true
            fi
            timeout 60 adb logcat -d 2>&1 | tail -80 | tee -a install.txt || true
          fi

          STATUS=0
          grep -q MUMBAI_WORLD_READY logcat-full.txt || {
            echo "FAIL: the world never finished loading"; STATUS=1; }
          grep -q MUMBAI_RENDER_OK logcat-full.txt || {
            echo "FAIL: the renderer never reached 30 frames"; STATUS=1; }
          # Every shader program must link on the real driver. A precision
          # mismatch between stages shows up nowhere else.
          grep -q 'MUMBAI_SHADERS_OK programs=5/5' logcat-full.txt || {
            echo "FAIL: not every shader program linked"; STATUS=1; }
          # The audio device must actually open. The emulator has a real
          # AudioTrack implementation, so this catches a bad format or
          # buffer size that no unit test can see.
          grep -q 'MUMBAI_AUDIO_OK' logcat-full.txt || {
            echo "FAIL: the audio output never started"; STATUS=1; }
          # The render-space tripwire. Everything handed to the GPU is in
          # the floating-origin frame, which snaps to a 512 m grid near
          # the player, so no instance can legitimately be further than a
          # draw distance from the origin. Four upload paths subtracted
          # the camera's render-space position instead of the origin
          # offset and put every pedestrian, blob shadow, moored craft and
          # train tens of kilometres away - drawn, counted in draw calls,
          # and never once on screen. Nothing but a real frame catches it.
          MAXINST=$(grep -o 'maxinst=[0-9]*' logcat-full.txt | tail -1 | cut -d= -f2)
          if [ -z "$MAXINST" ]; then
            echo "FAIL: the renderer never reported maxinst"; STATUS=1
          elif [ "$MAXINST" -gt 25000 ]; then
            echo "FAIL: an instance was uploaded ${MAXINST} m from the render"
            echo "      origin, so a world coordinate reached the GPU unrebased"
            STATUS=1
          else
            echo "ok: furthest uploaded instance ${MAXINST} m from the origin"
          fi
          if grep -q 'FATAL EXCEPTION' logcat-full.txt; then
            echo "FAIL: a fatal exception was thrown"; STATUS=1; fi
          adb shell pidof ai.shuvrajeetkamila.mumbai.islandcity \
            || { echo "FAIL: the process is not running"; STATUS=1; }
          grep -E 'MUMBAI_WORLD_READY|MUMBAI_RENDER_OK|MUMBAI_SHADERS_OK|MUMBAI_AUDIO_OK' logcat-full.txt || true
          echo "device_test status $STATUS"
          adb emu kill || true
          exit $STATUS

      - name: Publish the device log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No set -e here on purpose. This step exists to explain a failure;
          # it must never become one. Two previous runs lost their diagnosis,
          # once to a token permission and once to tail on a missing file.
          set +e
          mkdir -p data/reports
          {
            echo "run ${{ github.run_id }}  emulator step: ${{ steps.emu.outcome }}"
            echo "files present: $(ls 2>/dev/null | tr '\n' ' ')"
            echo "--- install ---";    cat install.txt    2>/dev/null
            echo "--- am start ---";   cat start.txt      2>/dev/null
            echo "--- app log ---";    tail -c 28000 logcat-app.txt 2>/dev/null
            echo "--- emulator ---";  tail -c 4000 emulator.txt 2>/dev/null
            echo "--- crashes/GL ---"
            grep -aE 'FATAL|AndroidRuntime|MumbaiGL|Mumbai|shader|GLES|libEGL|died|Exception' \
              logcat-full.txt 2>/dev/null | tail -120
          } > data/reports/device_test.log 2>&1
          wc -c data/reports/device_test.log
          gh issue create \
            --title "device_test ${{ steps.emu.outcome }}: run ${{ github.run_id }}" \
            --body "$(head -c 60000 data/reports/device_test.log)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/reports/device_test.log
          git commit -q -m "device_test log, run ${{ github.run_id }} [skip ci]"
          git pull --rebase --quiet origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
          exit 0

      - name: Keep the device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-logs
          path: |
            logcat-full.txt
            logcat-app.txt
            install.txt
            start.txt
          if-no-files-found: ignore

      - name: Fail the job if the app did not run
        if: always()
        run: |
          test "${{ steps.emu.outcome }}" = "success" \
            || { echo "the app did not install, load the world and render"; exit 1; }
