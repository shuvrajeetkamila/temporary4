plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    // The packaged-world startup test reads the real APK asset tree.
    systemProperty 'mumbai.assets', new File(rootDir, 'android/src/main/assets').absolutePath
}
